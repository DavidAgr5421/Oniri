[package]
name = "oniri-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Oniri Team"]
description = "Pure Rust native desktop studio for illustration and 2D animation using egui and wgpu"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["wgpu"] }
egui = "0.31"
oniri-brush-core = { path = "../oniri-brush-core" }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }


