[package]
name = "oniri-brush-core"
version = "0.1.0"
edition = "2021"
authors = ["Oniri Team"]
description = "High-performance Rust stroke calculation and dab engine for Oniri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
console_error_panic_hook = { version = "0.1.7", optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
