[package]
name = "animacion-app"
version = "0.1.0"
description = "Estudio profesional de ilustración digital y animación 2D, open source y multiplataforma"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oniri-brush-core = { path = "../crates/oniri-brush-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
