[package]
name = "animacion-app"
version = "0.1.0"
description = "Aplicación de animación estilo Clip Studio Paint, open source, multiplataforma"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

